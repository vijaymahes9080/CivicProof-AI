# Default values for CivicProof AI Helm Chart.

replicaCount: 3

image:
  repository: civicproof/api
  pullPolicy: IfNotPresent
  tag: "v1.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
  hosts:
    - host: api.civicproof.gov.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: civicproof-api-tls
      hosts:
        - api.civicproof.gov.in

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

monitoring:
  prometheus:
    enabled: true
    path: /metrics
    port: 8000
    interval: 15s
