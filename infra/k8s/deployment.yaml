apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicproof-api
  namespace: civicproof
  labels:
    app.kubernetes.io/name: civicproof-api
    app.kubernetes.io/part-of: civicproof-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: civicproof-api
  template:
    metadata:
      labels:
        app: civicproof-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: civicproof/api:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicproof-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: civicproof-secrets
                  key: jwt-secret
            - name: QDRANT_URL
              value: "http://qdrant-service.civicproof.svc.cluster.local:6333"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
