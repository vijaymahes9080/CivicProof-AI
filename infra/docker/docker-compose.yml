version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: civicproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicproof_user
      POSTGRES_PASSWORD: civicproof_secure_password_2026
      POSTGRES_DB: civicproof_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicproof_user -d civicproof_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: civicproof-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. Ollama Local Model Service
  ollama:
    image: ollama/ollama:latest
    container_name: civicproof-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 4. CivicProof FastAPI Backend
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: civicproof-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://civicproof_user:civicproof_secure_password_2026@postgres:5432/civicproof_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - SECRET_KEY=super-secret-civicproof-key-for-jwt-signing-replace-in-prod-2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. CivicProof React Web Frontend
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: civicproof-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  # 6. CivicProof Model Context Protocol (MCP) Server
  mcp_server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp
    container_name: civicproof-mcp-server
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - DATABASE_URL=postgresql+asyncpg://civicproof_user:civicproof_secure_password_2026@postgres:5432/civicproof_db

  # 7. n8n Scheduled Source Monitoring
  n8n:
    image: n8nio/n8n:latest
    container_name: civicproof-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=CivicProofN8NAdmin2026
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  n8n_data:
